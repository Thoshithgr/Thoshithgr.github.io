<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search Ops</title>
<meta name="description" content="Private job-search tracker: applications pipeline and target-company watchlist.">
<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --paper:#EEF1F4;
  --surface:#FFFFFF;
  --ink:#1A2330;
  --ink-dim:#5B6B7D;
  --line:#D7DEE5;
  --accent:#2F6F5E;
  --accent-ink:#FFFFFF;
  --st-researching:#5B6B7D;
  --st-applied:#4C6FA6;
  --st-screening:#A6740C;
  --st-interviewing:#6B5CA5;
  --st-offer:#2E7D4F;
  --st-rejected:#A6483A;
  --st-withdrawn:#8A94A0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:10px;
  --shadow:0 1px 2px rgba(26,35,48,0.06),0 1px 1px rgba(26,35,48,0.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F151C;
    --surface:#161E27;
    --ink:#E3E8ED;
    --ink-dim:#8C9AAA;
    --line:#28323D;
    --accent:#5FBFA4;
    --accent-ink:#0B1512;
    --st-researching:#8C9AAA;
    --st-applied:#89AEE0;
    --st-screening:#E0B04F;
    --st-interviewing:#B39FE0;
    --st-offer:#63C48A;
    --st-rejected:#E08376;
    --st-withdrawn:#8A94A0;
    --shadow:0 1px 2px rgba(0,0,0,0.4),0 1px 1px rgba(0,0,0,0.3);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
::selection{background:var(--accent);color:var(--accent-ink);}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
header.top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
header.top h1{font-size:19px;font-weight:700;letter-spacing:-0.01em;margin:0;}
header.top .sub{font-size:12.5px;color:var(--ink-dim);font-family:var(--mono);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:26px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.1;}
.stat .l{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;}
.stat.accent .n{color:var(--accent);}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.panel-head h2{font-size:14px;font-weight:600;margin:0;}
.panel-head .count{font-family:var(--mono);color:var(--ink-dim);font-size:12px;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filters button{font-family:var(--sans);font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;}
.filters button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:920px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--ink);}
thead th .arrow{opacity:0.5;font-size:9px;margin-left:3px;}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:color-mix(in srgb, var(--ink) 3%, transparent);}
td.mono,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
td.notes{color:var(--ink-dim);max-width:240px;}
td.company{font-weight:600;}
td.role{color:var(--ink-dim);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.st-researching{color:var(--st-researching);background:color-mix(in srgb, var(--st-researching) 14%, transparent);}
.pill.st-applied{color:var(--st-applied);background:color-mix(in srgb, var(--st-applied) 14%, transparent);}
.pill.st-screening{color:var(--st-screening);background:color-mix(in srgb, var(--st-screening) 14%, transparent);}
.pill.st-interviewing{color:var(--st-interviewing);background:color-mix(in srgb, var(--st-interviewing) 14%, transparent);}
.pill.st-offer{color:var(--st-offer);background:color-mix(in srgb, var(--st-offer) 14%, transparent);}
.pill.st-rejected{color:var(--st-rejected);background:color-mix(in srgb, var(--st-rejected) 14%, transparent);}
.pill.st-withdrawn{color:var(--st-withdrawn);background:color-mix(in srgb, var(--st-withdrawn) 14%, transparent);}
.apply-link{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap;}
.apply-link:hover{text-decoration:underline;}
.empty{padding:36px 18px;text-align:center;color:var(--ink-dim);font-size:13px;}
footer.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);text-align:center;margin-top:8px;}
@media (max-width:640px){
  .wrap{padding:18px 14px 60px;}
  header.top{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Job Search Ops</h1>
    <div class="sub">private tracker &middot; thoshith &middot; updated by Claude</div>
  </header>

  <div id="stats" class="stats"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>Applications</h2>
      <div class="filters" id="statusFilters"></div>
      <span class="count" id="appCount"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead id="appHead"></thead>
        <tbody id="appBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Target companies</h2>
      <span class="count" id="targetCount"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Company</th><th>Country</th><th>Why this one</th><th>Visa sponsorship</th><th>Notes</th></tr>
        </thead>
        <tbody id="targetBody"></tbody>
      </table>
    </div>
  </section>

  <footer class="meta">
    <span id="lastUpdated"></span>
  </footer>

</div>

const STATUSES = ["Researching","Applied","Screening","Interviewing","Offer","Rejected","Withdrawn"];
const STATUS_CLASS = {
  Researching:"st-researching", Applied:"st-applied", Screening:"st-screening",
  Interviewing:"st-interviewing", Offer:"st-offer", Rejected:"st-rejected", Withdrawn:"st-withdrawn"
};

let sortKey = "status";
let sortDir = "asc";
let statusFilter = "All";

function esc(s){
  const d = document.createElement('div');
  d.textContent = (s === undefined || s === null) ? "" : String(s);
  return d.innerHTML;
}
function escAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function safeHref(u){
  const s = String(u||'').trim();
  return /^https?:\/\//i.test(s) ? s : null;
}
function fmtDate(iso){
  if(!iso) return "&mdash;";
  const parts = iso.split("-");
  if(parts.length!==3) return esc(iso);
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[parseInt(parts[1],10)-1] + " " + parseInt(parts[2],10) + ", " + parts[0];
}

function computeStats(){
  const apps = STATE.applications;
  const active = apps.filter(a => ["Applied","Screening","Interviewing"].includes(a.status)).length;
  const interviewing = apps.filter(a => a.status === "Interviewing").length;
  const offers = apps.filter(a => a.status === "Offer").length;
  const decided = apps.filter(a => ["Screening","Interviewing","Offer","Rejected"].includes(a.status)).length;
  const respRate = apps.length ? Math.round((decided/apps.length)*100) : 0;
  return [
    {n: apps.length, l:"Total applications"},
    {n: active, l:"Active pipeline"},
    {n: interviewing, l:"Interviewing"},
    {n: offers, l:"Offers", accent:true},
    {n: respRate+"%", l:"Response rate"},
  ];
}

function renderStats(){
  document.getElementById('stats').innerHTML = computeStats().map(function(s){
    return '<div class="stat'+(s.accent?' accent':'')+'"><div class="n">'+esc(s.n)+'</div><div class="l">'+esc(s.l)+'</div></div>';
  }).join('');
}

function renderFilters(){
  const opts = ["All"].concat(STATUSES);
  document.getElementById('statusFilters').innerHTML = opts.map(function(o){
    return '<button data-status="'+esc(o)+'" class="'+(statusFilter===o?'active':'')+'">'+esc(o)+'</button>';
  }).join('');
}

const COLS = [
  {key:"company", label:"Company"},
  {key:"role", label:"Role"},
  {key:"location", label:"Location"},
  {key:"country", label:"Country"},
  {key:"source", label:"Source"},
  {key:"dateApplied", label:"Date applied"},
  {key:"status", label:"Status"},
  {key:"contact", label:"Contact"},
  {key:"nextStep", label:"Next step"},
  {key:"notes", label:"Notes"},
];

function renderAppHead(){
  const cells = COLS.map(function(c){
    const arrow = sortKey===c.key ? '<span class="arrow">'+(sortDir==="asc"?"&#9650;":"&#9660;")+'</span>' : '';
    return '<th data-key="'+c.key+'">'+esc(c.label)+arrow+'</th>';
  });
  cells.splice(2, 0, '<th>Apply</th>');
  document.getElementById('appHead').innerHTML = '<tr>' + cells.join('') + '</tr>';
}

function sortedFiltered(){
  let apps = STATE.applications.slice();
  if(statusFilter!=="All") apps = apps.filter(function(a){return a.status===statusFilter;});
  const statusOrder = {Interviewing:0, Screening:1, Applied:2, Offer:3, Researching:4, Withdrawn:5, Rejected:6};
  apps.sort(function(a,b){
    let av = sortKey==="status" ? statusOrder[a.status] : (a[sortKey] || "");
    let bv = sortKey==="status" ? statusOrder[b.status] : (b[sortKey] || "");
    if(av < bv) return sortDir==="asc" ? -1 : 1;
    if(av > bv) return sortDir==="asc" ? 1 : -1;
    return 0;
  });
  return apps;
}

function renderAppBody(){
  const el = document.getElementById('appBody');
  const rows = sortedFiltered();
  document.getElementById('appCount').textContent = STATE.applications.length + (STATE.applications.length===1?" row":" rows");
  if(!rows.length){
    el.innerHTML = '<tr><td colspan="11"><div class="empty">No applications match this filter.</div></td></tr>';
    return;
  }
  el.innerHTML = rows.map(function(a){
    const href = safeHref(a.link);
    const applyCell = href
      ? '<a class="apply-link" href="'+escAttr(href)+'" target="_blank" rel="noopener">Apply &#8599;</a>'
      : (a.link ? esc(a.link) : '<span class="mono" style="color:var(--ink-dim)">&mdash;</span>');
    return '<tr>'
      + '<td class="company">'+esc(a.company)+'</td>'
      + '<td class="role">'+esc(a.role)+'</td>'
      + '<td>'+applyCell+'</td>'
      + '<td>'+esc(a.location)+'</td>'
      + '<td>'+esc(a.country)+'</td>'
      + '<td>'+esc(a.source)+'</td>'
      + '<td class="mono">'+fmtDate(a.dateApplied)+'</td>'
      + '<td><span class="pill '+(STATUS_CLASS[a.status]||'')+'">'+esc(a.status)+'</span></td>'
      + '<td>'+esc(a.contact)+'</td>'
      + '<td>'+esc(a.nextStep)+'</td>'
      + '<td class="notes">'+esc(a.notes)+'</td>'
      + '</tr>';
  }).join('');
}

function renderTargets(){
  const el = document.getElementById('targetBody');
  document.getElementById('targetCount').textContent = STATE.targets.length + (STATE.targets.length===1?" row":" rows");
  if(!STATE.targets.length){
    el.innerHTML = '<tr><td colspan="5"><div class="empty">No target companies yet.</div></td></tr>';
    return;
  }
  el.innerHTML = STATE.targets.map(function(t){
    return '<tr>'
      + '<td class="company">'+esc(t.company)+'</td>'
      + '<td>'+esc(t.country)+'</td>'
      + '<td>'+esc(t.why)+'</td>'
      + '<td>'+esc(t.visa)+'</td>'
      + '<td class="notes">'+esc(t.notes)+'</td>'
      + '</tr>';
  }).join('');
}

function renderFooter(){
  document.getElementById('lastUpdated').textContent = STATE.updatedAt
    ? ("last updated " + new Date(STATE.updatedAt).toLocaleString())
    : "not yet updated";
}

function render(){
  renderStats();
  renderFilters();
  renderAppHead();
  renderAppBody();
  renderTargets();
  renderFooter();
}

document.getElementById('appHead').addEventListener('click', function(e){
  const th = e.target.closest('th[data-key]');
  if(!th) return;
  const key = th.dataset.key;
  if(sortKey === key){ sortDir = sortDir === "asc" ? "desc" : "asc"; }
  else { sortKey = key; sortDir = "asc"; }
  renderAppHead();
  renderAppBody();
});

document.getElementById('statusFilters').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-status]');
  if(!btn) return;
  statusFilter = btn.dataset.status;
  renderFilters();
  renderAppBody();
});

render();
</script>
